name: Deploy the extract function

# Deploys supabase/functions/extract from the browser, for anyone working
# without a terminal. Runs on demand, or whenever the function changes.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-function.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF under Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase functions deploy extract --project-ref "$PROJECT_REF"
          echo "Deployed. Set ANTHROPIC_API_KEY in Supabase → Edge Functions → Secrets if you have not already."
